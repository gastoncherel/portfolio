<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaston Chérel — Portfolio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#1c1c1c;
    --ink:#efefe9;
    --ink-dim:#9a9a92;
    --accent:#efefe9;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  #viewer{
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-behavior:auto;
    -webkit-overflow-scrolling:touch;
  }

  #pages{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:14px 10px calc(70px + env(safe-area-inset-bottom,0px)) 10px;
    min-height:100%;
  }

  .page-wrap{
    position:relative;
    max-width:100%;
    line-height:0;
    overflow:hidden;
    background:#2a2a2a;
    box-shadow:0 4px 22px rgba(0,0,0,.4);
  }
  .page-wrap canvas{
    display:block;
    max-width:100%;
    height:auto;
  }
  .zoom-inner{ position:relative; transform-origin:0 0; touch-action:pan-y; }
  .textLayer{ position:absolute; inset:0; overflow:hidden; line-height:1; }
  .textLayer span, .textLayer br{ color:transparent; position:absolute; white-space:pre; cursor:text; transform-origin:0% 0%; }
  .textLayer ::selection{ background:rgba(120,170,255,.35); }
  .linkLayer{ position:absolute; inset:0; }
  .linkLayer a{ position:absolute; display:block; }
  .linkLayer a:hover{ background:rgba(255,255,255,.12); }
  .page-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-dim);
    font-size:12px;
    letter-spacing:.02em;
  }

  /* Fullscreen: paginated, one page fills the viewport */
  body.fs #viewer{
    scroll-snap-type:y mandatory;
  }
  body.fs #pages{
    gap:0;
    padding:0;
  }
  body.fs .page-wrap{
    scroll-snap-align:start;
    scroll-snap-stop:always;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    box-shadow:none;
  }
  body.fs .page-wrap canvas{
    max-height:100vh;
    max-height:100dvh;
    max-width:100vw;
    width:auto;
    height:auto;
  }

  #hud{
    position:fixed;
    right:14px;
    right:calc(14px + env(safe-area-inset-right,0px));
    bottom:14px;
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    z-index:20;
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:none;
  }
  body.fs #hud{ display:none; }

  #counter{
    background:rgba(20,20,20,.72);
    backdrop-filter:blur(3px);
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    letter-spacing:.02em;
    color:var(--ink);
    pointer-events:auto;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  #fs-btn{
    pointer-events:auto;
    background:rgba(245,245,242,.95);
    border:1px solid rgba(0,0,0,.15);
    color:#1c1c1c;
    width:42px;
    height:42px;
    flex:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.45);
    transition:transform .15s ease;
  }
  #fs-btn:hover{ transform:scale(1.08); }
  #fs-btn:focus-visible{ outline:2px solid #1c1c1c; outline-offset:2px; }
  #fs-btn svg{ width:20px; height:20px; stroke-width:2.2; }

  #loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    background:var(--bg);
    color:var(--ink-dim);
    font-size:13px;
    letter-spacing:.03em;
    z-index:10;
    transition:opacity .3s ease;
  }
  #loading .name{ color:var(--ink); font-size:15px; }
  #bar{
    width:160px;
    height:2px;
    background:rgba(255,255,255,.15);
    overflow:hidden;
  }
  #bar-fill{
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .2s ease;
  }

  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#eeece6;
      --ink:#1c1c1c;
      --ink-dim:#7a7a72;
    }
    :root:not([data-theme="dark"]) .page-wrap{ background:#f6f5f1; }
    :root:not([data-theme="dark"]) body.fs .page-wrap{ background:#000; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="name">Gaston Chérel — Portfolio</div>
  <div id="bar"><div id="bar-fill"></div></div>
</div>

<div id="viewer">
  <div id="pages"></div>
</div>

<div id="hud">
  <div id="counter">–&nbsp;/&nbsp;–</div>
  <button id="fs-btn" aria-label="Plein écran" title="Plein écran (F)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3H4v5"/><path d="M15 3h5v5"/><path d="M9 21H4v-5"/><path d="M15 21h5v-5"/>
    </svg>
  </button>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const PDF_URL = "portfolio.pdf";

const pagesEl = document.getElementById('pages');
const counterEl = document.getElementById('counter');
const fsBtn = document.getElementById('fs-btn');
const viewer = document.getElementById('viewer');
const loading = document.getElementById('loading');
const barFill = document.getElementById('bar-fill');

let pdfDoc = null;
let numPages = 0;
let pageWraps = [];       // container divs, one per page
let pageDims = [];        // {w,h} fixed CSS size per page, set once at layout time
let renderedFlags = [];   // whether page has been drawn
let currentPage = 1;

function pxScale(){
  return Math.min(window.devicePixelRatio || 1, 3);
}

async function renderPage(pageNum){
  if (renderedFlags[pageNum - 1]) return;
  renderedFlags[pageNum - 1] = true;

  const page = await pdfDoc.getPage(pageNum);
  const wrap = pageWraps[pageNum - 1];
  const placeholder = wrap.querySelector('.page-placeholder');
  const dim = pageDims[pageNum - 1]; // exact CSS size, fixed at layout time (no reflow later)
  const cssScale = dim.w / page.getViewport({ scale: 1 }).width;
  const viewport = page.getViewport({ scale: cssScale * pxScale() });

  const inner = document.createElement('div');
  inner.className = 'zoom-inner';
  inner.style.width = dim.w + 'px';
  inner.style.height = dim.h + 'px';

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  canvas.style.width = dim.w + 'px';
  canvas.style.height = dim.h + 'px';
  const ctx = canvas.getContext('2d', { alpha: false });
  inner.appendChild(canvas);

  if (placeholder) placeholder.remove();
  wrap.appendChild(inner);
  setupZoom(wrap, inner);

  await page.render({ canvasContext: ctx, viewport }).promise;

  // Selectable text layer
  const textLayerDiv = document.createElement('div');
  textLayerDiv.className = 'textLayer';
  textLayerDiv.style.width = dim.w + 'px';
  textLayerDiv.style.height = dim.h + 'px';
  inner.appendChild(textLayerDiv);
  const textContent = await page.getTextContent();
  pdfjsLib.renderTextLayer({
    textContentSource: textContent,
    container: textLayerDiv,
    viewport: page.getViewport({ scale: cssScale })
  });

  // Clickable links
  const annots = await page.getAnnotations();
  if (annots.length){
    const linkLayerDiv = document.createElement('div');
    linkLayerDiv.className = 'linkLayer';
    const linkViewport = page.getViewport({ scale: cssScale });
    annots.forEach(a => {
      if (a.subtype !== 'Link' || !a.url) return;
      const r = linkViewport.convertToViewportRectangle(a.rect);
      const x = Math.min(r[0], r[2]), y = Math.min(r[1], r[3]);
      const w = Math.abs(r[2] - r[0]), h = Math.abs(r[3] - r[1]);
      const link = document.createElement('a');
      link.href = a.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.style.left = x + 'px';
      link.style.top = y + 'px';
      link.style.width = w + 'px';
      link.style.height = h + 'px';
      linkLayerDiv.appendChild(link);
    });
    inner.appendChild(linkLayerDiv);
  }
}

// Pinch (touch) and double-click/double-tap zoom on an individual page, without zooming the page
function setupZoom(wrap, inner){
  let scale = 1, tx = 0, ty = 0;
  let pinchStartDist = 0, pinchStartScale = 1;
  let dragging = false, lastX = 0, lastY = 0;

  function apply(){
    inner.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    inner.style.zIndex = scale > 1 ? 5 : 'auto';
  }
  function dist(t){ return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }

  wrap.addEventListener('dblclick', (e) => {
    e.preventDefault();
    if (scale > 1){ scale = 1; tx = 0; ty = 0; }
    else {
      const r = wrap.getBoundingClientRect();
      scale = 2.5;
      tx = -((e.clientX - r.left) * (scale - 1));
      ty = -((e.clientY - r.top) * (scale - 1));
    }
    apply();
  });

  wrap.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2){
      pinchStartDist = dist(e.touches);
      pinchStartScale = scale;
    } else if (e.touches.length === 1 && scale > 1){
      dragging = true;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    }
  }, { passive: true });

  wrap.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2){
      e.preventDefault();
      scale = Math.min(4, Math.max(1, pinchStartScale * (dist(e.touches) / pinchStartDist)));
      apply();
    } else if (dragging && e.touches.length === 1){
      e.preventDefault();
      tx += e.touches[0].clientX - lastX;
      ty += e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      apply();
    }
  }, { passive: false });

  wrap.addEventListener('touchend', (e) => {
    if (e.touches.length === 0){ dragging = false; if (scale <= 1.02){ scale = 1; tx = 0; ty = 0; apply(); } }
  });

  wrap.addEventListener('mousedown', (e) => {
    if (scale <= 1) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging || scale <= 1) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  window.addEventListener('mouseup', () => { dragging = false; });
}

function updateCounter(){
  counterEl.textContent = currentPage + ' / ' + numPages;
}

// Determine which page is most visible and lazily render neighbours
function onScroll(){
  const viewerRect = viewer.getBoundingClientRect();
  const viewerMid = viewerRect.top + viewerRect.height / 2;

  let best = 1, bestDist = Infinity;
  pageWraps.forEach((wrap, i) => {
    const r = wrap.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    const dist = Math.abs(mid - viewerMid);
    if (dist < bestDist){ bestDist = dist; best = i + 1; }
  });
  if (best !== currentPage){
    currentPage = best;
    updateCounter();
  }

  // Render current +/- 2 pages
  for (let p = Math.max(1, currentPage - 2); p <= Math.min(numPages, currentPage + 2); p++){
    renderPage(p);
  }
}

function goToPage(n, smooth){
  n = Math.max(1, Math.min(numPages, n));
  currentPage = n;
  updateCounter();
  renderPage(n);
  if (n > 1) renderPage(n - 1);
  if (n < numPages) renderPage(n + 1);
  pageWraps[n - 1].scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
}

function isFullscreen(){
  return !!document.fullscreenElement;
}

function enterFullscreen(){
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
}
function exitFullscreen(){
  (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
}

document.addEventListener('fullscreenchange', syncFsState);
document.addEventListener('webkitfullscreenchange', syncFsState);

function syncFsState(){
  if (isFullscreen()){
    document.body.classList.add('fs');
    pageWraps[currentPage - 1].scrollIntoView({ behavior: 'auto', block: 'start' });
  } else {
    document.body.classList.remove('fs');
    pageWraps[currentPage - 1].scrollIntoView({ behavior: 'auto', block: 'start' });
  }
}

fsBtn.addEventListener('click', () => {
  isFullscreen() ? exitFullscreen() : enterFullscreen();
});

window.addEventListener('keydown', (e) => {
  if (['ArrowDown','ArrowRight',' ','Spacebar','ArrowUp','ArrowLeft'].includes(e.key)){
    e.preventDefault();
  }
  if (e.key === 'f' || e.key === 'F'){
    isFullscreen() ? exitFullscreen() : enterFullscreen();
    return;
  }
  if (!isFullscreen()) return; // keyboard paging only meaningful in fullscreen
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Spacebar'){
    goToPage(currentPage + 1, true);
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft'){
    goToPage(currentPage - 1, true);
  }
  // Escape is handled natively by the browser to leave fullscreen
});

let scrollTimer = null;
viewer.addEventListener('scroll', () => {
  if (scrollTimer) return;
  scrollTimer = requestAnimationFrame(() => { onScroll(); scrollTimer = null; });
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    // Recompute fixed dimensions for the new window size, then re-render nearby pages
    renderedFlags = renderedFlags.map(() => false);
    pageWraps.forEach((w, i) => {
      const aspect = pageDims[i].h / pageDims[i].w;
      const cssW = Math.round(Math.min(window.innerWidth, 1600));
      const cssH = Math.round(cssW * aspect);
      pageDims[i] = { w: cssW, h: cssH };
      w.style.width = cssW + 'px';
      w.style.height = cssH + 'px';
      w.innerHTML = '';
      const ph = document.createElement('div');
      ph.className = 'page-placeholder';
      ph.style.width = cssW + 'px';
      ph.style.height = cssH + 'px';
      w.appendChild(ph);
    });
    onScroll();
  }, 250);
});

async function init(){
  try{
    const loadingTask = pdfjsLib.getDocument({ url: PDF_URL });
    loadingTask.onProgress = (p) => {
      if (p.total){
        barFill.style.width = Math.min(100, Math.round((p.loaded / p.total) * 100)) + '%';
      }
    };
    pdfDoc = await loadingTask.promise;
    numPages = pdfDoc.numPages;

    for (let i = 1; i <= numPages; i++){
      const page = await pdfDoc.getPage(i);
      const vp = page.getViewport({ scale: 1 });
      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      const cssW = Math.round(Math.min(window.innerWidth, 1600));
      const cssH = Math.round(cssW * (vp.height / vp.width));
      wrap.style.width = cssW + 'px';
      wrap.style.height = cssH + 'px';

      const placeholder = document.createElement('div');
      placeholder.className = 'page-placeholder';
      placeholder.style.width = cssW + 'px';
      placeholder.style.height = cssH + 'px';
      placeholder.textContent = 'Page ' + i;
      wrap.appendChild(placeholder);

      pagesEl.appendChild(wrap);
      pageWraps.push(wrap);
      pageDims.push({ w: cssW, h: cssH });
      renderedFlags.push(false);
    }

    updateCounter();
    await renderPage(1);
    if (numPages > 1) await renderPage(2);

    loading.style.opacity = '0';
    setTimeout(() => loading.remove(), 350);

    onScroll();
  } catch(err){
    loading.innerHTML = '<div class="name">Impossible de charger le PDF</div><div style="color:#c66;font-size:12px;max-width:280px;text-align:center;">' + (err && err.message ? err.message : '') + '</div>';
    console.error(err);
  }
}

init();
</script>
</body>
</html>
