<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaston Chérel — Portfolio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#1c1c1c;
    --ink:#efefe9;
    --ink-dim:#9a9a92;
    --accent:#efefe9;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  #viewer{
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    overflow-x:auto;
    scroll-behavior:auto;
    -webkit-overflow-scrolling:touch;
  }

  #pages{
    display:block;
    padding:14px 10px calc(70px + env(safe-area-inset-bottom,0px)) 10px;
    min-height:100%;
  }

  .page-wrap{
    position:relative;
    margin:0 auto 14px auto;
    line-height:0;
    overflow:hidden;
    background:#2a2a2a;
    box-shadow:0 4px 22px rgba(0,0,0,.4);
  }
  .page-wrap canvas{
    display:block;
    max-width:100%;
    height:auto;
  }
  .zoom-inner{ position:absolute; inset:0; }
  .textLayer{ position:absolute; inset:0; overflow:hidden; line-height:1; text-align:initial; text-size-adjust:none; forced-color-adjust:none; transform-origin:0 0; z-index:1; }
  .textLayer span, .textLayer br{ color:transparent; position:absolute; white-space:pre; cursor:text; transform-origin:0% 0%; }
  .textLayer > :not(.markedContent), .textLayer .markedContent{ top:0; height:0; }
  .textLayer ::selection{ background:rgb(0 0 255 / .25); }
  .textLayer br::selection{ background:transparent; }
  .textLayer .endOfContent{ display:block; position:absolute; inset:100% 0 0; z-index:-1; cursor:default; user-select:none; }
  .textLayer .endOfContent.active{ top:0; }
  .linkLayer{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .linkLayer a{ position:absolute; display:block; pointer-events:auto; }
  .linkLayer a.link-plain:hover{ background:rgba(110,110,110,.28); border-radius:2px; }
  .linkLayer a.link-linkedin:hover{ background:rgba(255,255,255,.12); }
  .page-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-dim);
    font-size:12px;
    letter-spacing:.02em;
  }

  /* Fullscreen: paginated, one page fills the viewport */
  body.fs #viewer{
    scroll-snap-type:y mandatory;
    touch-action:pan-y;
  }
  body.fs #pages{
    padding:0;
  }
  body.fs .page-wrap{
    margin:0 0 10px 0;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    box-shadow:none;
  }
  body.fs .page-wrap canvas{
    max-height:100vh;
    max-height:100dvh;
    max-width:100vw;
    width:auto;
    height:auto;
  }

  body.fs.zoomed #viewer{
    scroll-snap-type:none;
  }
  #hud{
    position:fixed;
    right:14px;
    right:calc(14px + env(safe-area-inset-right,0px));
    bottom:14px;
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    z-index:20;
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:none;
  }
  body.fs #hud{ display:none; }

  #counter{
    background:rgba(245,245,242,.95);
    border:1px solid rgba(0,0,0,.15);
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    letter-spacing:.02em;
    color:#1c1c1c;
    pointer-events:auto;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
  }

  #fs-btn{
    pointer-events:auto;
    background:rgba(245,245,242,.95);
    border:1px solid rgba(0,0,0,.15);
    color:#1c1c1c;
    width:42px;
    height:42px;
    flex:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.45);
    transition:transform .15s ease;
  }
  #fs-btn:hover{ transform:scale(1.08); }
  #fs-btn:focus-visible{ outline:2px solid #1c1c1c; outline-offset:2px; }
  #fs-btn svg{ width:20px; height:20px; stroke-width:2.2; }

  #loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    background:var(--bg);
    color:var(--ink-dim);
    font-size:13px;
    letter-spacing:.03em;
    z-index:10;
    transition:opacity .3s ease;
  }
  #loading .name{ color:var(--ink); font-size:15px; }
  #bar{
    width:160px;
    height:2px;
    background:rgba(255,255,255,.15);
    overflow:hidden;
  }
  #bar-fill{
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .2s ease;
  }

  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#eeece6;
      --ink:#1c1c1c;
      --ink-dim:#7a7a72;
    }
    :root:not([data-theme="dark"]) .page-wrap{ background:#f6f5f1; }
    :root:not([data-theme="dark"]) body.fs .page-wrap{ background:#000; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="name">Gaston Chérel — Portfolio</div>
  <div id="bar"><div id="bar-fill"></div></div>
</div>

<div id="viewer">
  <div id="pages"></div>
</div>

<div id="hud">
  <div id="counter">–&nbsp;/&nbsp;–</div>
  <button id="fs-btn" aria-label="Plein écran" title="Plein écran (F)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3H4v5"/><path d="M15 3h5v5"/><path d="M9 21H4v-5"/><path d="M15 21h5v-5"/>
    </svg>
  </button>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const PDF_URL = "portfolio.pdf";

const pagesEl = document.getElementById('pages');
const counterEl = document.getElementById('counter');
const fsBtn = document.getElementById('fs-btn');
const viewer = document.getElementById('viewer');
const loading = document.getElementById('loading');
const barFill = document.getElementById('bar-fill');

let pdfDoc = null;
let numPages = 0;
let pageWraps = [];       // container divs, one per page
let pageDims = [];        // {w,h} fixed CSS size per page, set once at layout time
let renderedFlags = [];   // whether page has been drawn
let currentPage = 1;

function pxScale(){
  return Math.min(window.devicePixelRatio || 1, 3);
}

async function renderPage(pageNum){
  if (renderedFlags[pageNum - 1]) return;
  renderedFlags[pageNum - 1] = true;

  const page = await pdfDoc.getPage(pageNum);
  const wrap = pageWraps[pageNum - 1];
  const placeholder = wrap.querySelector('.page-placeholder');
  const dim = pageDims[pageNum - 1]; // exact CSS size, fixed at layout time (no reflow later)
  const cssScale = dim.w / page.getViewport({ scale: 1 }).width;
  const viewport = page.getViewport({ scale: cssScale * pxScale() });

  const inner = document.createElement('div');
  inner.className = 'zoom-inner';
  inner.style.width = dim.w + 'px';
  inner.style.height = dim.h + 'px';

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  canvas.style.width = dim.w + 'px';
  canvas.style.height = dim.h + 'px';
  const ctx = canvas.getContext('2d', { alpha: false });
  inner.appendChild(canvas);

  wrap.appendChild(inner); // old preview (if any) stays underneath until this is fully ready

  await page.render({ canvasContext: ctx, viewport }).promise;

  // Selectable text layer
  const textLayerDiv = document.createElement('div');
  textLayerDiv.className = 'textLayer';
  textLayerDiv.style.width = dim.w + 'px';
  textLayerDiv.style.height = dim.h + 'px';
  textLayerDiv.style.setProperty('--scale-factor', cssScale);
  inner.appendChild(textLayerDiv);
  const textContent = await page.getTextContent();
  pdfjsLib.renderTextLayer({
    textContentSource: textContent,
    container: textLayerDiv,
    viewport: page.getViewport({ scale: cssScale })
  });
  const eoc = document.createElement('div');
  eoc.className = 'endOfContent';
  textLayerDiv.appendChild(eoc);

  // Clickable links
  const annots = await page.getAnnotations();
  if (annots.length){
    const linkLayerDiv = document.createElement('div');
    linkLayerDiv.className = 'linkLayer';
    const linkViewport = page.getViewport({ scale: cssScale });
    annots.forEach(a => {
      if (a.subtype !== 'Link' || !a.url) return;
      const r = linkViewport.convertToViewportRectangle(a.rect);
      const x = Math.min(r[0], r[2]), y = Math.min(r[1], r[3]);
      const w = Math.abs(r[2] - r[0]), h = Math.abs(r[3] - r[1]);
      const link = document.createElement('a');
      link.href = a.url;
      link.className = /linkedin\.com/i.test(a.url) ? 'link-linkedin' : 'link-plain';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.style.left = x + 'px';
      link.style.top = y + 'px';
      link.style.width = w + 'px';
      link.style.height = h + 'px';
      linkLayerDiv.appendChild(link);
    });
    inner.appendChild(linkLayerDiv);
  }

  // Only now swap out the old preview/placeholder — no blank flash in between
  wrap.querySelectorAll('.zoom-inner, .page-placeholder').forEach(el => { if (el !== inner) el.remove(); });
}

// 16 zoom steps, like Edge's PDF reader
const ZOOM_STEPS = [1, 1.1, 1.2, 1.35, 1.5, 1.65, 1.8, 2, 2.2, 2.4, 2.6, 2.8, 3, 3.3, 3.6, 4];
let zoomIndex = 0;
let zoomLevel = 1;

function baseTargetWidth(){
  if (isFullscreen()) return Math.round(viewer.clientWidth); // fullscreen fills the screen, as before
  const SIDE_MARGIN = 28; // reserved so plates never touch the scrollbar or viewport edge
  const PAGE_MAX_W = 900; // smaller, more comfortable default reading size
  return Math.max(260, Math.min(viewer.clientWidth - SIDE_MARGIN * 2, PAGE_MAX_W));
}

function relayout(){
  renderedFlags = renderedFlags.map(() => false);
  const cssW = baseTargetWidth() * zoomLevel;
  pageWraps.forEach((w, i) => {
    const oldDim = pageDims[i];
    const aspect = oldDim.h / oldDim.w;
    const newW = Math.round(cssW);
    const newH = Math.round(cssW * aspect);
    w.style.width = newW + 'px';
    w.style.height = newH + 'px';
    const existing = w.querySelector('.zoom-inner');
    if (existing){
      // Instant scaled preview of the previous render while the crisp version loads —
      // avoids any blank flash between zoom steps.
      existing.style.transformOrigin = '0 0';
      existing.style.transform = `scale(${newW / oldDim.w})`;
    } else {
      const ph = w.querySelector('.page-placeholder');
      if (ph){ ph.style.width = newW + 'px'; ph.style.height = newH + 'px'; }
    }
    pageDims[i] = { w: newW, h: newH };
  });
}

function setZoom(newLevel, clientX, clientY){
  if (newLevel === zoomLevel) return;
  const r = viewer.getBoundingClientRect();
  const beforeX = viewer.scrollLeft + (clientX - r.left);
  const beforeY = viewer.scrollTop + (clientY - r.top);
  const ratio = newLevel / zoomLevel;
  zoomLevel = newLevel;
  relayout();
  viewer.scrollLeft = beforeX * ratio - (clientX - r.left);
  viewer.scrollTop = beforeY * ratio - (clientY - r.top);
  document.body.classList.toggle('zoomed', zoomLevel > 1);
  onScroll();
}

let previewScale = 1;
let previewTimer = null;
let lastPointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let gestureOrigin = null; // fixed once per gesture, in #pages' own untransformed coordinates

function livePreview(cx, cy){
  if (!gestureOrigin){
    // Only measured at the very start of a gesture, while no transform is applied yet —
    // getBoundingClientRect() would return the already-scaled box otherwise, causing drift.
    const r = pagesEl.getBoundingClientRect();
    gestureOrigin = { x: cx - r.left, y: cy - r.top };
  }
  pagesEl.style.transformOrigin = gestureOrigin.x + 'px ' + gestureOrigin.y + 'px';
  pagesEl.style.transform = `scale(${previewScale})`;
  lastPointer = { x: cx, y: cy };
  clearTimeout(previewTimer);
  previewTimer = setTimeout(commitPreview, 160);
}

function commitPreview(){
  gestureOrigin = null;
  if (previewScale === 1) return;
  const target = Math.min(4, Math.max(1, zoomLevel * previewScale));
  let nearest = 0, best = Infinity;
  ZOOM_STEPS.forEach((s, i) => { const d = Math.abs(s - target); if (d < best){ best = d; nearest = i; } });
  previewScale = 1;
  pagesEl.style.transform = '';
  pagesEl.style.transformOrigin = '';
  zoomIndex = nearest;
  if (ZOOM_STEPS[nearest] !== zoomLevel) setZoom(ZOOM_STEPS[nearest], lastPointer.x, lastPointer.y);
}

// Ctrl+wheel (mouse) and trackpad pinch — smooth live preview, snapped to a crisp
// render once the gesture settles. Disabled in fullscreen: fullscreen never zooms.
viewer.addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  if (isFullscreen()) return; // block the browser's own zoom too; no zoom at all in fullscreen
  const maxPreview = 4 / zoomLevel, minPreview = 1 / zoomLevel;
  previewScale = Math.min(maxPreview, Math.max(minPreview, previewScale * Math.exp(-e.deltaY * 0.0025)));
  livePreview(e.clientX, e.clientY);
}, { passive: false });

// Two-finger pinch (touchscreens) — same live-preview-then-commit approach
let pinchStartDist = 0;
function touchDist(t){ return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
viewer.addEventListener('touchstart', (e) => {
  if (!isFullscreen() && e.touches.length === 2) pinchStartDist = touchDist(e.touches);
}, { passive: true });
viewer.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 2) return;
  if (isFullscreen()){ e.preventDefault(); return; } // block native pinch-zoom too
  if (!pinchStartDist) return;
  e.preventDefault();
  const maxPreview = 4 / zoomLevel, minPreview = 1 / zoomLevel;
  previewScale = Math.min(maxPreview, Math.max(minPreview, touchDist(e.touches) / pinchStartDist));
  livePreview((e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2);
}, { passive: false });
viewer.addEventListener('touchend', (e) => {
  if (e.touches.length < 2 && pinchStartDist){ pinchStartDist = 0; commitPreview(); }
});

function updateCounter(){
  counterEl.textContent = currentPage + ' / ' + numPages;
}

// Determine which page is most visible and lazily render neighbours
function onScroll(){
  const viewerRect = viewer.getBoundingClientRect();
  const viewerMid = viewerRect.top + viewerRect.height / 2;

  let best = 1, bestDist = Infinity;
  pageWraps.forEach((wrap, i) => {
    const r = wrap.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    const dist = Math.abs(mid - viewerMid);
    if (dist < bestDist){ bestDist = dist; best = i + 1; }
  });
  if (best !== currentPage){
    currentPage = best;
    updateCounter();
  }

  // Render current +/- 2 pages
  for (let p = Math.max(1, currentPage - 2); p <= Math.min(numPages, currentPage + 2); p++){
    renderPage(p);
  }
}

function goToPage(n, smooth){
  n = Math.max(1, Math.min(numPages, n));
  currentPage = n;
  updateCounter();
  renderPage(n);
  if (n > 1) renderPage(n - 1);
  if (n < numPages) renderPage(n + 1);
  pageWraps[n - 1].scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
}

function isFullscreen(){
  return !!document.fullscreenElement;
}

function enterFullscreen(){
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
}
function exitFullscreen(){
  (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
}

document.addEventListener('fullscreenchange', syncFsState);
document.addEventListener('webkitfullscreenchange', syncFsState);

function syncFsState(){
  document.body.classList.toggle('fs', isFullscreen());
  zoomIndex = 0; zoomLevel = 1;
  document.body.classList.remove('zoomed');
  relayout();
  viewer.scrollLeft = 0;
  pageWraps[currentPage - 1].scrollIntoView({ behavior: 'auto', block: 'start' });
  onScroll();
}

fsBtn.addEventListener('click', () => {
  isFullscreen() ? exitFullscreen() : enterFullscreen();
});

window.addEventListener('keydown', (e) => {
  if (['ArrowDown','ArrowRight',' ','Spacebar','ArrowUp','ArrowLeft'].includes(e.key)){
    e.preventDefault();
  }
  if (e.key === 'f' || e.key === 'F'){
    isFullscreen() ? exitFullscreen() : enterFullscreen();
    return;
  }
  if (!isFullscreen()) return; // keyboard paging only meaningful in fullscreen
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Spacebar'){
    goToPage(currentPage + 1, true);
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft'){
    goToPage(currentPage - 1, true);
  }
  // Escape is handled natively by the browser to leave fullscreen
});

let scrollTimer = null;
document.addEventListener('mousedown', (e) => {
  if (e.target.closest && e.target.closest('.textLayer')){
    document.querySelectorAll('.endOfContent').forEach(el => el.classList.add('active'));
  }
});
document.addEventListener('mouseup', () => {
  document.querySelectorAll('.endOfContent.active').forEach(el => el.classList.remove('active'));
});
viewer.addEventListener('scroll', () => {
  if (scrollTimer) return;
  scrollTimer = requestAnimationFrame(() => { onScroll(); scrollTimer = null; });
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { relayout(); onScroll(); }, 250);
});

async function init(){
  try{
    const loadingTask = pdfjsLib.getDocument({ url: PDF_URL });
    loadingTask.onProgress = (p) => {
      if (p.total){
        barFill.style.width = Math.min(100, Math.round((p.loaded / p.total) * 100)) + '%';
      }
    };
    pdfDoc = await loadingTask.promise;
    numPages = pdfDoc.numPages;

    for (let i = 1; i <= numPages; i++){
      const page = await pdfDoc.getPage(i);
      const vp = page.getViewport({ scale: 1 });
      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      const cssW = baseTargetWidth();
      const cssH = Math.round(cssW * (vp.height / vp.width));
      wrap.style.width = cssW + 'px';
      wrap.style.height = cssH + 'px';

      const placeholder = document.createElement('div');
      placeholder.className = 'page-placeholder';
      placeholder.style.width = cssW + 'px';
      placeholder.style.height = cssH + 'px';
      placeholder.textContent = 'Page ' + i;
      wrap.appendChild(placeholder);

      pagesEl.appendChild(wrap);
      pageWraps.push(wrap);
      pageDims.push({ w: cssW, h: cssH });
      renderedFlags.push(false);
    }

    updateCounter();
    await renderPage(1);
    if (numPages > 1) await renderPage(2);

    loading.style.opacity = '0';
    setTimeout(() => loading.remove(), 350);

    onScroll();
  } catch(err){
    loading.innerHTML = '<div class="name">Impossible de charger le PDF</div><div style="color:#c66;font-size:12px;max-width:280px;text-align:center;">' + (err && err.message ? err.message : '') + '</div>';
    console.error(err);
  }
}

init();
</script>
</body>
</html>
